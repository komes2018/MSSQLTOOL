name: Build VSIX

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README*.md'
      - 'pics/**'
      - '.vscode/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VSIX Package
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSMS 22 Build Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ssmsRoot = 'C:\Program Files\Microsoft SQL Server Management Studio 22\Release'
          $required = Join-Path $ssmsRoot 'Common7\IDE\Extensions\Application\Microsoft.SqlServer.TransactSql.ScriptDom.dll'

          if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
            Write-Host "Downloading SSMS 22 bootstrapper..."
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_SSMS.exe'

            Invoke-WebRequest `
              -Uri 'https://aka.ms/ssms/22/release/vs_SSMS.exe' `
              -OutFile $bootstrapper

            Write-Host "Installing SSMS 22 (quiet mode)..."
            $installerArgs = @(
              '--quiet',
              '--wait',
              '--norestart'
            )

            $process = Start-Process `
              -FilePath $bootstrapper `
              -ArgumentList $installerArgs `
              -Wait `
              -PassThru

            $exitCode = $process.ExitCode
            Write-Host "Installer finished with exit code $exitCode"

            if ($exitCode -notin @(0, 3010)) {
              throw "SSMS 22 installation failed with exit code $exitCode"
            }
          }

          Write-Host "Discovering installed SSMS 22 files..."

          $searchRoots = @(
            'C:\Program Files\Microsoft SQL Server Management Studio 22',
            'C:\Program Files (x86)\Microsoft SQL Server Management Studio 22'
          ) | Where-Object { Test-Path -LiteralPath $_ }

          $ssmsExe = $searchRoots |
            ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter 'Ssms.exe' -File -Recurse -ErrorAction SilentlyContinue } |
            Select-Object -First 1

          if ($null -eq $ssmsExe) {
            Write-Host 'Top-level Microsoft SQL Server Management Studio directories:'
            Get-ChildItem 'C:\Program Files' -Directory -Filter '*SQL Server Management Studio*' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            throw 'SSMS 22 installation completed but Ssms.exe was not found.'
          }

          Write-Host "SSMS executable: $($ssmsExe.FullName)"
          $ssmsReleaseDir = Split-Path -Parent (Split-Path -Parent $ssmsExe.FullName)
          Write-Host "SSMS Release directory: $ssmsReleaseDir"
          "SSMS_INSTALL_ROOT=$ssmsReleaseDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Resolve missing HintPath in all csproj files
          $csprojFiles = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter '*.csproj' -Recurse

          foreach ($proj in $csprojFiles) {
            Write-Host "Checking HintPaths in $($proj.FullName)..."
            [xml]$projectXml = Get-Content -LiteralPath $proj.FullName
            $ns = New-Object System.Xml.XmlNamespaceManager($projectXml.NameTable)
            $ns.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')

            $changed = $false
            $hintNodes = $projectXml.SelectNodes('//msb:Reference/msb:HintPath', $ns)

            foreach ($hintNode in $hintNodes) {
              $hint = $hintNode.InnerText

              if ($hint -notlike '*Microsoft SQL Server Management Studio*') {
                continue
              }

              if (Test-Path -LiteralPath $hint -PathType Leaf) {
                continue
              }

              $fileName = Split-Path -Leaf $hint
              $match = $searchRoots |
                ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter $fileName -File -Recurse -ErrorAction SilentlyContinue } |
                Select-Object -First 1

              if ($null -eq $match) {
                throw "Required SSMS build dependency was not found after installation: $fileName (in $($proj.Name))"
              }

              Write-Host "Resolved $fileName -> $($match.FullName)"
              $hintNode.InnerText = $match.FullName
              $changed = $true
            }

            if ($changed) {
              $projectXml.Save($proj.FullName)
              Write-Host "Updated $($proj.Name) with resolved assembly paths."
            }
          }

          Write-Host "SSMS 22 build dependencies are ready."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release VSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          msbuild "MSSQLTool\MSSQLTool.sln" `
            /restore `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:DeployExtension=false `
            /p:PostBuildEvent=

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Stage VSIX Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsix = Join-Path $env:GITHUB_WORKSPACE "MSSQLTool\bin\Release\MSSQLTool.vsix"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "MSSQLTool\source.extension.vsixmanifest"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"

          if (-not (Test-Path -LiteralPath $vsix -PathType Leaf)) {
            # Check if any .vsix was produced in the bin directory
            $anyVsix = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "MSSQLTool\bin") -Filter '*.vsix' -Recurse | Select-Object -First 1
            if ($null -ne $anyVsix) {
              $vsix = $anyVsix.FullName
            } else {
              throw "Expected VSIX was not produced: $vsix"
            }
          }

          [xml]$manifestXml = Get-Content -LiteralPath $manifest
          $version = $manifestXml.PackageManifest.Metadata.Identity.Version

          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "unknown"
          }

          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $outputVsix = Join-Path $dist "MSSQLTool-v$version.vsix"
          Copy-Item -LiteralPath $vsix -Destination $outputVsix -Force

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "vsix_file=$outputVsix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Successfully packaged: $outputVsix"
          Get-Item -LiteralPath $outputVsix | Format-List FullName, Length, LastWriteTime

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSSQLTool-v${{ steps.package.outputs.version }}
          path: dist/*.vsix
          if-no-files-found: error
          overwrite: true
          retention-days: 14
